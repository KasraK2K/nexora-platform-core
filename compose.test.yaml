services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexora_test
      POSTGRES_USER: nexora_test
      POSTGRES_PASSWORD: nexora_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_test -d nexora_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
