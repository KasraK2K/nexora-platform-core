name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint:check
      - run: pnpm run typecheck
      - run: pnpm run check:deprecated
      - run: pnpm run contract:check
      - run: pnpm run docs:check
      - run: pnpm run test:architecture
      - run: pnpm run build
      - run: pnpm run test --runInBand

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:test:up
      - run: pnpm run db:push:test
      - run: pnpm run db:seed:test
      - run: pnpm run db:seed:test
      - run: pnpm run test:e2e
      - if: always()
        run: pnpm run db:test:down
